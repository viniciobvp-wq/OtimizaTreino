@startuml
skinparam defaultFontName "DejaVu Sans"
skinparam defaultFontSize 13
skinparam shadowing false
skinparam roundCorner 8
skinparam ArrowColor #344054
skinparam BorderColor #344054
skinparam ActorBorderColor #344054
skinparam ActorBackgroundColor #FFF4EC
skinparam UsecaseBackgroundColor #FFF4EC
skinparam UsecaseBorderColor #CF561D
skinparam ClassBackgroundColor #FFFFFF
skinparam ClassHeaderBackgroundColor #FFE7D9
skinparam ClassBorderColor #CF561D
skinparam EntityBackgroundColor #FFFFFF
skinparam ActivityBackgroundColor #FFF4EC
skinparam ActivityBorderColor #CF561D
skinparam ActivityDiamondBackgroundColor #FFFFFF
skinparam ParticipantBackgroundColor #FFF4EC
skinparam ParticipantBorderColor #CF561D
skinparam DatabaseBackgroundColor #E8F0FB
skinparam SequenceLifeLineBorderColor #98A2B3
skinparam SequenceGroupBackgroundColor #F2F4F7
skinparam NoteBackgroundColor #FEF9C3
skinparam NoteBorderColor #CA8A04
skinparam PackageBorderColor #98A2B3
skinparam RectangleBorderColor #98A2B3
left to right direction
actor "Praticante" as P
rectangle "OtimizaTreino" {
  usecase "UC01\nGerenciar Usuários" as UC01
  usecase "UC02\nGerenciar Exercícios" as UC02
  usecase "UC03\nGerenciar Treinos" as UC03
  usecase "UC04\nRegistrar Sessão\nde Treino" as UC04
  usecase "UC05\nOtimizar Treino" as UC05
  usecase "Selecionar\npraticante ativo" as SEL
  usecase "Aplicar sugestões\nna ficha" as APL
}
P - -> UC01
P - -> UC02
P - -> UC03
P - -> UC04
P - -> UC05
UC03 ..> SEL : <<include>>
UC04 ..> SEL : <<include>>
UC05 ..> SEL : <<include>>
UC05 <.. APL : <<extend>>
@enduml

